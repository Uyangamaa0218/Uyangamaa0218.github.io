<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Block with Image</title>
    <meta name="description"
content="A hero block with a background image and a tinted overlay.">
<link rel="preload" href="assets/img/business.jpg" as="image">

    <!-- Link to Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Custom styles -->
    <style type="text/tailwindcss">

    header::before {
    content: "";
    @apply absolute inset-0 bg-black/40;
}
        header { 
            @apply relative
            min-h-[60vh] md:min-h-[80vh]
            bg-linear-to-b from-purple-600 to-purple-900 
            bg-gray-600
            bg-[url('assets/img/business.jpg')] bg-cover bg-center flex flex-col justify-center
            px-8 lg:px-60 py-12
            text-center;
        }   
        

        header h1 {
            @apply text-7xl md:text-8xl
            text-white font-bold
            tracking-tight
            mb-6;
        }

        header h2 {
            @apply text-shadow-lg/30
            text-4xl md:text-5xl
            text-white;
        }

        
        .slide-in-top {
	    animation: slide-in-top 1s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
        }
        /* ----------------------------------------------
 * Generated by Animista on 2026-10-12 15:7:49
 * Licensed under FreeBSD License.
 * See http://animista.net/license for more info. 
 * w: http://animista.net, t: @cssanimista
 * ---------------------------------------------- */

/**
 * ----------------------------------------
 * animation slide-in-top
 * ----------------------------------------
 */
@keyframes slide-in-top {
  0% {
    transform: translateY(-1000px);
    opacity: 0;
  }
  100% {
    transform: translateY(0);
    opacity: 1;
  }
}

.slide-in-left {
	animation: slide-in-left 1s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
}
/* ----------------------------------------------
 * Generated by Animista on 2026-10-12 15:13:45
 * Licensed under FreeBSD License.
 * See http://animista.net/license for more info. 
 * w: http://animista.net, t: @cssanimista
 * ---------------------------------------------- */

/**
 * ----------------------------------------
 * animation slide-in-left
 * ----------------------------------------
 */
@keyframes slide-in-left {
  0% {
    transform: translateX(-1000px);
    opacity: 0;
  }
  100% {
    transform: translateX(0);
    opacity: 1;
  }
}

    </style>
</head>

<body>

    <!-- hero block -->
     <header>
        <h1 class="slide-in-top">Albert Camus</h1>

        <h2 class="slide-in-left">Creative Web Developer</h2>
    </header>
    <!-- /hero block -->

</body>
</html>
