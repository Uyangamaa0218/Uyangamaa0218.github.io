<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Uyangamaa Gantulga 81572 -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Block with Video</title>
    <meta name="description"
    content="A hero block with a background video that plays in a continuous loop and includes a tinted overlay.">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">

    header::before {
    content: "";
    @apply absolute inset-0 bg-black/40; }
        header { 
            @apply relative
            min-h-[60vh] md:min-h-[80vh]
            bg-linear-to-b from-purple-600 to-purple-900 
            bg-gray-600
            flex flex-col justify-center
            px-8 lg:px-60 py-12
            text-center
            overflow-hidden;
        }   
        header video {
        @apply absolute inset-0
           w-full h-full
           object-cover;
        }
        

        header h1 {
            @apply relative z-10
            text-7xl md:text-8xl
            text-white font-bold
            tracking-tight
            mb-6;
        }

        header h2 {
            @apply relative z-10
            text-shadow-lg/30
            text-4xl md:text-5xl
            text-white;
        }

        
        .slide-in-top {
	    animation: slide-in-top 1s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
        }
        
@keyframes slide-in-top {
  0% {
    transform: translateY(-1000px);
    opacity: 0;
  }
  100% {
    transform: translateY(0);
    opacity: 1;
  }
}

.slide-in-left {
	animation: slide-in-left 1s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
}

@keyframes slide-in-left {
  0% {
    transform: translateX(-1000px);
    opacity: 0;
  }
  100% {
    transform: translateX(0);
    opacity: 1;
  }
}

    </style>
</head>

<body>

    <!-- hero block -->
     <header>
    <video
        autoplay
        muted
        loop
        playsinline
        poster="assets/videos/hero-still.jpg">

        <source
            src="assets/videos/hero.video.mp4"
            type="video/mp4">
    </video>

    <h1>Education for Life</h1>

    <h2>A brighter career and future</h2>

</header>
    <!-- /hero block -->
  
    <footer>
      <p>Uyangamaa Gantulga | 81572</p>
    </footer>
</body>
</html>
